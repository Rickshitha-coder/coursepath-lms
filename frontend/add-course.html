<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add course — Coursepath</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="admin-courses">
<div class="shell">
  <div id="navbar-mount"></div>

  <main class="page">
    <div class="container" style="max-width:640px;">
      <div class="section-title"><div><span class="eyebrow">Course Management</span><h2 style="margin-top:4px;">Add a course</h2></div></div>
      <div class="card card-pad">
        <div id="alert-mount"></div>
        <form id="course-form" novalidate>
          <div class="field-row">
            <div class="field" data-field="name"><label for="name">Course name</label><input id="name" name="name" placeholder="e.g. Full Stack Web Development"><div class="error">Enter a course name.</div></div>
          </div>
          <div class="field-row">
            <div class="field" data-field="instructor"><label for="instructor">Instructor</label><input id="instructor" name="instructor" placeholder="Faculty name"><div class="error">Enter an instructor name.</div></div>
            <div class="field" data-field="duration"><label for="duration">Duration (weeks)</label><input id="duration" name="duration" type="number" min="1" placeholder="8"><div class="error">Enter a valid duration.</div></div>
          </div>
          <div class="field" data-field="category">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
              <option>Web</option><option>Programming</option><option>AI</option><option>Databases</option><option>Design</option><option>Other</option>
            </select>
            <div class="error">Select a category.</div>
          </div>
          <div class="field" data-field="description"><label for="description">Description</label><textarea id="description" name="description" rows="3" placeholder="What will students learn?"></textarea><div class="error">Add a short description.</div></div>

          <div class="field">
            <label>Modules</label>
            <div id="modules-list"></div>
            <button type="button" class="btn btn-outline btn-sm mt-8" id="add-module-btn">+ Add module</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block mt-16">Create course</button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script>
  const admin = Api.requireRole('admin');

  function addModuleRow(value) {
    const list = document.getElementById('modules-list');
    const row = document.createElement('div');
    row.className = 'flex gap-8 mt-8';
    row.innerHTML = `<input type="text" class="module-input" placeholder="Module title" value="${value ? UI.escapeHtml(value) : ''}" style="flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px;"><button type="button" class="btn btn-outline btn-sm remove-module">&times;</button>`;
    row.querySelector('.remove-module').addEventListener('click', () => row.remove());
    list.appendChild(row);
  }
  ['HTML', 'CSS', 'JavaScript'].forEach(addModuleRow);
  document.getElementById('add-module-btn').addEventListener('click', () => addModuleRow(''));

  const form = document.getElementById('course-form');
  Validate.attach(form, [
    { selector: '#name', test: v => Validate.required(v), message: 'Enter a course name.' },
    { selector: '#instructor', test: v => Validate.required(v), message: 'Enter an instructor name.' },
    { selector: '#duration', test: v => Number(v) > 0, message: 'Enter a valid duration.' },
    { selector: '#category', test: v => Validate.required(v), message: 'Select a category.' },
    { selector: '#description', test: v => Validate.required(v), message: 'Add a short description.' },
  ]);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = form.name.value.trim(), instructor = form.instructor.value.trim(),
          duration = Number(form.duration.value), category = form.category.value,
          description = form.description.value.trim();
    if (!name || !instructor || !(duration > 0) || !category || !description) return;
    const modules = [...document.querySelectorAll('.module-input')].map(i => i.value.trim()).filter(Boolean);
    if (!modules.length) { UI.toast('Add at least one module.'); return; }

    const res = await Api.createCourse({ name, instructor, duration, category, description, modules });
    if (!res.ok) { document.getElementById('alert-mount').innerHTML = `<div class="alert alert-error">${UI.escapeHtml(res.error)}</div>`; return; }
    UI.toast('Course created.');
    setTimeout(() => window.location.href = 'admin-courses.html', 600);
  });
</script>
</body>
</html>
