<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Coursepath</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="forgot-password">
<div class="shell">
  <div id="navbar-mount"></div>
  <main class="page">
    <div class="container" style="max-width:440px;">
      <div class="text-center" style="margin-bottom:24px;">
        <span class="eyebrow">Account Recovery</span>
        <h2 style="margin-top:6px;">Reset your password</h2>
        <p class="muted" style="font-size:.92rem;">Confirm your account email, then set a new password.</p>
      </div>
      <div class="card card-pad form-card" style="margin:0;">
        <div id="alert-mount"></div>
        <form id="reset-form" novalidate>
          <div class="field" data-field="email">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com">
            <div class="error">Enter a valid email address.</div>
          </div>
          <div class="field" data-field="password">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters">
            <div class="error">Password must be at least 8 characters.</div>
          </div>
          <div class="field" data-field="confirm">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Re-enter new password">
            <div class="error">Passwords don't match.</div>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Update password</button>
        </form>
        <p class="form-foot"><a href="login.html" style="color:var(--indigo); font-weight:600;">Back to login</a></p>
      </div>
    </div>
  </main>
  <div id="footer-mount"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/validation.js"></script>
<script>
  const form = document.getElementById('reset-form');
  Validate.attach(form, [
    { selector: '#email', test: v => Validate.required(v) && Validate.email(v), message: 'Enter a valid email address.' },
    { selector: '#password', test: v => Validate.minLen(v, 8), message: 'Password must be at least 8 characters.' },
    { selector: '#confirm', test: (v, f) => Validate.matches(v, f.querySelector('#password').value), message: "Passwords don't match." },
  ]);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = form.email.value.trim(), password = form.password.value, confirm = form.confirm.value;
    if (!email || !Validate.email(email) || password.length < 8 || password !== confirm) return;
    const res = await Api.resetPassword({ email, newPassword: password });
    const mount = document.getElementById('alert-mount');
    if (!res.ok) { mount.innerHTML = `<div class="alert alert-error">${UI.escapeHtml(res.error)}</div>`; return; }
    mount.innerHTML = `<div class="alert alert-success">Password updated — redirecting to login…</div>`;
    setTimeout(() => window.location.href = 'login.html', 900);
  });
</script>
</body>
</html>
