<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Coursepath</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="notifications">
<div class="shell">
  <div id="navbar-mount"></div>

  <main class="page">
    <div class="container" style="max-width:680px;">
      <div class="section-title">
        <div><span class="eyebrow">Notifications</span><h2 style="margin-top:4px;">Notifications</h2></div>
        <button class="btn btn-outline btn-sm" id="mark-read-btn">Mark all as read</button>
      </div>
      <div class="card" id="list"></div>
    </div>
  </main>

  <div id="footer-mount"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  (async () => {
    const user = Api.requireAuth();
    if (!user) return;

    async function render() {
      const items = (await Api.listNotifications(user.id)).data;
      const list = document.getElementById('list');
      if (!items.length) { list.innerHTML = `<div class="empty-state"><h3>You're all caught up</h3><p>New course alerts, enrollment confirmations, and certificates will show up here.</p></div>`; return; }
      list.innerHTML = items.map(n => `
        <div class="notif-item ${n.read ? '' : 'unread'}">
          <span class="notif-dot ${n.read ? 'read' : ''}"></span>
          <div>
            <div>${UI.escapeHtml(n.message)}</div>
            <div class="notif-time">${UI.timeAgo(n.date)}</div>
          </div>
        </div>`).join('');
    }
    render();

    document.getElementById('mark-read-btn').addEventListener('click', async () => {
      await Api.markAllRead(user.id);
      render();
      UI.toast('All notifications marked as read.');
    });
  })();
</script>
</body>
</html>
