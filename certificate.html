<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate — Coursepath</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .cert{ border:3px solid var(--indigo); border-radius:14px; padding:56px 40px; text-align:center; background:
    radial-gradient(circle at 10% 10%, var(--amber-soft), transparent 40%), #fff; position:relative; }
  .cert::before{ content:''; position:absolute; inset:10px; border:1px solid var(--amber); border-radius:8px; pointer-events:none; }
  @media print{ #navbar-mount, #footer-mount, .no-print{ display:none !important; } main{ padding:0 !important; } }
</style>
</head>
<body data-page="progress">
<div class="shell">
  <div id="navbar-mount"></div>
  <main class="page">
    <div class="container" style="max-width:760px;" id="wrap">Loading…</div>
  </main>
  <div id="footer-mount"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  (async () => {
    const user = Api.requireRole('student');
    if (!user) return;
    const courseId = new URLSearchParams(location.search).get('courseId');
    const courseRes = await Api.getCourse(courseId);
    const prog = (await Api.getProgress(user.id, courseId)).data;
    const wrap = document.getElementById('wrap');

    if (!courseRes.ok || !prog || prog.percentage < 100) {
      wrap.innerHTML = `<div class="empty-state"><h3>Certificate not available yet</h3><p>Complete every module in this course to unlock its certificate.</p><a href="progress.html" class="btn btn-primary mt-16">Back to progress</a></div>`;
      return;
    }
    const course = courseRes.data;
    wrap.innerHTML = `
      <div class="cert">
        <span class="eyebrow">Certificate of Completion</span>
        <h1 style="margin:18px 0 6px; font-size:2rem;">${UI.escapeHtml(course.name)}</h1>
        <p class="muted">This certifies that</p>
        <h2 style="font-size:1.6rem; margin:6px 0 18px;">${UI.escapeHtml(user.name)}</h2>
        <p class="muted" style="max-width:44ch; margin:0 auto;">has successfully completed all ${course.modules.length} modules of this course on Coursepath.</p>
        <p class="mt-24" style="font-family:var(--font-mono); font-size:.82rem; color:var(--text-dim);">Issued ${new Date().toLocaleDateString()}</p>
      </div>
      <div class="text-center mt-24 no-print"><button class="btn btn-primary" onclick="window.print()">Print / save as PDF</button></div>
    `;
  })();
</script>
</body>
</html>
